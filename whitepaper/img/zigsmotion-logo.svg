<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 240" width="1150" height="240" fill="none">
  <title>ZigsMotion</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;display=swap');
    .w{font:700 112px Orbitron,'Eurostile','Arial Black',sans-serif;letter-spacing:6px}</style>
  <defs>
    <linearGradient id="zmWord" x1="600" y1="0" x2="1235" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD6FF"/><stop offset="1" stop-color="#2F7BF0"/>
    </linearGradient>
  </defs>
  <g transform="translate(10 20) scale(.62)">
      <defs>
        <linearGradient id="zmTop" x1="24" y1="63" x2="363" y2="63" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#5FD8FF"/><stop offset=".55" stop-color="#3A97F4"/><stop offset=".86" stop-color="#2463EA"/><stop offset="1" stop-color="#1A4FD6"/>
        </linearGradient>
        <linearGradient id="zmBot" x1="37" y1="263" x2="386" y2="263" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#1A4FD6"/><stop offset=".14" stop-color="#2463EA"/><stop offset=".5" stop-color="#3A97F4"/><stop offset="1" stop-color="#63DCFF"/>
        </linearGradient>
        <!-- the diagonal runs under both bars: shadowed at each fold, lit mid-way -->
        <linearGradient id="zmDiag" x1="330" y1="63" x2="70" y2="263" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#0F2F9C"/><stop offset=".2" stop-color="#2564EA"/><stop offset=".55" stop-color="#4CC6FF"/>
          <stop offset=".8" stop-color="#2564EA"/><stop offset="1" stop-color="#0F2F9C"/>
        </linearGradient>
        <linearGradient id="zmGloss" x1="0" y1="30" x2="0" y2="96" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M309.9 36.8 L350.1 89.2 L90.1 289.2 L49.9 236.8 Z" fill="url(#zmDiag)"/>
      <path d="M24 96 L90 30 H330 A33 33 0 0 1 330 96 Z" fill="url(#zmTop)"/>
      <path d="M24 96 L90 30 H330 A33 33 0 0 1 357 44 L60 60 Z" fill="url(#zmGloss)"/>
      <path d="M70 230 H386 L320 296 H70 A33 33 0 0 1 70 230 Z" fill="url(#zmBot)"/>
  </g>
  <text class="w" x="280" y="166"><tspan fill="#F4F7FB">ZIGS</tspan><tspan fill="url(#zmWord)">MOTION</tspan></text>
</svg>
